server {
    listen 80;
    listen [::]:80;
    server_name oefenschrift.nl www.oefenschrift.nl;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/oefenschrift-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://oefenschrift.nl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.oefenschrift.nl;
    ssl_certificate /etc/letsencrypt/live/oefenschrift.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oefenschrift.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://oefenschrift.nl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oefenschrift.nl;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml text/x-script;
    ssl_certificate /etc/letsencrypt/live/oefenschrift.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oefenschrift.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        client_max_body_size 10m;
    }
}
